name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `GET /healthz` or the git commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [ollama, azure_openai, other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal curl or code. Redact keys and any real prompt content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (logs, response body)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
