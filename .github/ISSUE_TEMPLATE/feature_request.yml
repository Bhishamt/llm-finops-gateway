name: Feature request
description: Propose a capability or a design change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who is affected (platform team, finance, security, app developer).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: adr
    attributes:
      label: Does this need an ADR?
      description: Yes if it changes an endpoint, schema, default, provider set, policy or what a user is charged.
      options: ["Not sure", "Yes", "No"]
