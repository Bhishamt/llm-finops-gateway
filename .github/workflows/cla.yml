name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".cla-signatures/v1/cla.json"
          path-to-document: "https://github.com/andrasKelle/llm-finops-gateway/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "andrasKelle,dependabot[bot]"
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged you need to accept the
            Contributor License Agreement by commenting the sentence below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
