<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#fcfcfb"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0b0b0b">llm-finops-gateway: request path</text>
  <text x="40" y="68" font-size="13" fill="#52514e">Fail closed before money is spent; attribute and price after. No prompt text is stored.</text>

  <!-- client -->
  <rect x="40" y="200" width="150" height="90" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="115" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Application</text>
  <text x="115" y="252" font-size="11" text-anchor="middle" fill="#52514e">OpenAI SDK, LangChain</text>
  <text x="115" y="268" font-size="11" text-anchor="middle" fill="#52514e">base_url = gateway</text>

  <line x1="190" y1="245" x2="250" y2="245" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="232" font-size="10" text-anchor="middle" fill="#52514e">Bearer key</text>
  <text x="220" y="266" font-size="10" text-anchor="middle" fill="#52514e">X-Project</text>

  <!-- gateway -->
  <rect x="250" y="110" width="440" height="300" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="270" y="138" font-size="15" font-weight="700" fill="#2a78d6">Gateway (FastAPI)</text>
  <text x="270" y="156" font-size="11" fill="#52514e">POST /v1/chat/completions</text>

  <g font-size="12" fill="#0b0b0b">
    <rect x="270" y="170" width="400" height="34" rx="6" fill="#f3f3f0"/>
    <text x="282" y="192">1  Auth + owner</text>
    <text x="410" y="192" fill="#52514e">team key, X-Project</text>
    <text x="600" y="192" fill="#d03b3b" font-weight="600">401 / 400</text>

    <rect x="270" y="212" width="400" height="34" rx="6" fill="#f3f3f0"/>
    <text x="282" y="234">2  Price book</text>
    <text x="410" y="234" fill="#52514e">unknown model fails</text>
    <text x="600" y="234" fill="#d03b3b" font-weight="600">422</text>

    <rect x="270" y="254" width="400" height="34" rx="6" fill="#f3f3f0"/>
    <text x="282" y="276">3  Policy</text>
    <text x="410" y="276" fill="#52514e">allow-list, rate, reserve</text>
    <text x="600" y="276" fill="#d03b3b" font-weight="600">403 / 429</text>

    <rect x="270" y="296" width="400" height="34" rx="6" fill="#e9f1fb"/>
    <text x="282" y="318">4  Provider call</text>
    <text x="410" y="318" fill="#52514e">Ollama, Azure, compatible</text>
    <text x="600" y="318" fill="#d03b3b" font-weight="600">502</text>

    <rect x="270" y="338" width="400" height="34" rx="6" fill="#e9f1fb"/>
    <text x="282" y="360">5  Price + ledger</text>
    <text x="410" y="360" fill="#52514e">tokens x versioned price, one row per call</text>

    <text x="270" y="396" font-size="11" fill="#52514e">6  Response: OpenAI shape or SSE stream + x_finops {cost, budget, warnings} + X-FinOps-* headers</text>
  </g>

  <!-- rejected arrow -->
  <line x1="690" y1="230" x2="760" y2="230" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="770" y="226" font-size="11" fill="#d03b3b" font-weight="600">rejected before</text>
  <text x="770" y="240" font-size="11" fill="#d03b3b" font-weight="600">any spend</text>

  <!-- provider -->
  <line x1="690" y1="313" x2="760" y2="313" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="760" y="285" width="200" height="56" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="860" y="309" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">LLM provider</text>
  <text x="860" y="327" font-size="11" text-anchor="middle" fill="#52514e">Azure | Ollama | OpenAI-compat</text>

  <!-- config -->
  <rect x="250" y="440" width="200" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="350" y="463" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">config/ (git)</text>
  <text x="350" y="481" font-size="11" text-anchor="middle" fill="#52514e">pricing.yaml  v2026-11-02</text>
  <text x="350" y="497" font-size="11" text-anchor="middle" fill="#52514e">policies.yaml, keys.yaml (hashes)</text>
  <line x1="350" y1="440" x2="350" y2="412" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ledger -->
  <rect x="490" y="440" width="200" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="590" y="463" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">Ledger</text>
  <text x="590" y="481" font-size="11" text-anchor="middle" fill="#52514e">SQLite / PostgreSQL</text>
  <text x="590" y="497" font-size="11" text-anchor="middle" fill="#52514e">team, model, tokens, cost, price ver.</text>
  <line x1="590" y1="412" x2="590" y2="440" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- reports -->
  <rect x="760" y="440" width="200" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="860" y="463" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">Chargeback</text>
  <text x="860" y="481" font-size="11" text-anchor="middle" fill="#52514e">/finops page, summary JSON + CSV</text>
  <text x="860" y="497" font-size="11" text-anchor="middle" fill="#52514e">budgets, /metrics, OTel, webhook alerts</text>
  <line x1="690" y1="475" x2="760" y2="475" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
