# LiteLLM proxy config with the FinOps plugin enabled. Same models as config.yaml.
model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: azure/gpt-4.1-mini-dev
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
  - model_name: gpt-5-mini
    litellm_params:
      model: azure/gpt-5-mini-dev
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
  - model_name: mystery-model
    litellm_params:
      model: azure/gpt-4.1-mini-dev
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  callbacks: [prometheus, llm_finops_gateway.litellm_plugin.plugin]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The report page inside the dashboard (ADR-0024): the url is what the browser reaches the
  # finops-report service at. Sign in to the UI, then pick "FinOps" in the mode switcher.
  plugins:
    - name: finops
      display_name: FinOps
      url: http://localhost:8081
