services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  gateway:
    build: .
    depends_on: [ollama]
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      LFG_PROVIDER: ${LFG_PROVIDER:-ollama}
      LFG_OLLAMA_BASE_URL: http://ollama:11434
      # Local play without keys. Remove for anything shared (ADR-0006).
      LFG_AUTH_MODE: ${LFG_AUTH_MODE:-headers}
    volumes: ["gateway-data:/data"]

volumes:
  ollama:
  gateway-data:
