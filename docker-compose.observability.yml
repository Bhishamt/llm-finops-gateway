# Local Prometheus + Grafana for the gateway's /metrics, with the dashboard provisioned.
#
#   docker compose -f docker-compose.observability.yml up -d
#   open http://localhost:3000        (admin / admin), dashboard "LLM FinOps gateway"
#
# Prometheus scrapes a gateway running on the host at :8080 (host.docker.internal); edit
# observability/prometheus.yml to scrape a gateway elsewhere. Prometheus keeps its data only
# while the container exists (no volume): this is a local viewer, not a store.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # local viewer: open the dashboard without signing in (edit as admin / admin)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-finops-gateway.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/dashboards-src:ro
    # The committed dashboard references the data source as ${DS_PROMETHEUS} so that a manual
    # import asks which Prometheus to use; for provisioning it is pinned to the one below.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/grafana/dashboards &&
        sed 's/$${DS_PROMETHEUS}/prometheus/g' /dashboards-src/llm-finops-gateway.json > /var/lib/grafana/dashboards/llm-finops-gateway.json &&
        exec /run.sh
